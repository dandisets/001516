description: 'This experiment focused on visualizing and characterizing the recovery
  dynamics of the plasma membrane in CHO cells following electroporation induced by
  a 1-us electric pulse. Each cell underwent a sequence of 60 exposures: 20 sham exposures
  with no pulse applied and 40 exposures with one or two 1-us pulses of varying amplitudes
  and interval between pulses.'
